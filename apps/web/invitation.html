<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Set up your login · Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atlas-tokens.css?v=20260926-s88">
<link rel="stylesheet" href="assets/css/atlas-shell.css?v=20260926-s88">
</head>
<body data-atlas-standalone="true">
<div class="atlas-auth">
  <main class="atlas-auth__column" aria-labelledby="invite-title">
    <div class="atlas-auth__brand"><span class="atlas-brand__mark" aria-hidden="true">A</span><span class="atlas-auth__wordmark">Atlas</span></div>
    <h1 class="atlas-auth__title" id="invite-title">Set up your Atlas login</h1>
    <p class="atlas-auth__sub" id="invite-sub">Choose a password to finish joining VÁ.</p>
    <div class="atlas-auth__skeleton" id="invite-checking" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="atlas-auth__status" id="status" role="status">Checking your invitation…</p>
    <form id="accept-invitation" class="atlas-auth__form" hidden>
      <div class="atlas-auth__readonly" id="invite-account" hidden><span>Email</span><strong id="invite-email"></strong></div>
      <div class="atlas-field">
        <label for="new-password">New password</label>
        <input class="atlas-input" id="new-password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="invite-rules">
      </div>
      <ul class="atlas-auth__rules" id="invite-rules" aria-live="polite"><li data-rule="length">At least 10 characters</li><li data-rule="match">Both passwords match</li></ul>
      <div class="atlas-field">
        <label for="confirm-password">Confirm password</label>
        <input class="atlas-input" id="confirm-password" type="password" autocomplete="new-password" minlength="10" required>
      </div>
      <button type="submit" class="atlas-btn atlas-btn--primary atlas-btn--lg atlas-auth__submit">Create login</button>
    </form>
    <p class="atlas-auth__link"><a href="index.html">Back to sign in</a></p>
  </main>
  <p class="atlas-auth__foot">VÁ · Reykjavík</p>
</div>
<script src="config.js"></script><script src="assets/js/rehearsal-boundary.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script><script src="assets/js/account-invitation.js"></script></body></html>
