<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>Reset your password · Atlas</title>
<link rel="icon" href="assets/brand/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atlas-tokens.css?v=20260929-s90f">
<link rel="stylesheet" href="assets/css/atlas-base.css?v=20260929-s90u">
<link rel="stylesheet" href="assets/css/atlas-components.css?v=20260930-s90g">
<link rel="stylesheet" href="assets/css/atlas-shell.css?v=20260929-s90u">
</head><body data-atlas-standalone="true">
<div class="atlas-auth">
  <main class="atlas-auth__column" aria-labelledby="recovery-title">
    <div class="atlas-auth__brand"><img class="atlas-auth__lockup" src="assets/brand/Atlas_Primary_Stacked_Midnight.svg" alt="Atlas" width="112" height="99"></div>
    <h1 class="atlas-auth__title" id="recovery-title">Reset your password</h1>
    <p class="atlas-auth__sub" id="status" role="status">Enter your email and we'll send you a link to choose a new password.</p>
    <form id="request-recovery" class="atlas-auth__form" novalidate>
      <div class="atlas-field">
        <label for="recovery-email">Email</label>
        <input class="atlas-input" id="recovery-email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required aria-describedby="recovery-email-error">
        <p class="atlas-field__error" id="recovery-email-error" hidden></p>
      </div>
      <button type="submit" class="atlas-btn atlas-btn--primary atlas-btn--lg atlas-auth__submit">Send reset link</button>
    </form>
    <form id="complete-recovery" class="atlas-auth__form" novalidate hidden>
      <div class="atlas-field">
        <label for="new-password">New password</label>
        <input class="atlas-input" id="new-password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="recovery-rules">
      </div>
      <ul class="atlas-auth__rules" id="recovery-rules" aria-live="polite"><li data-rule="length">At least 10 characters</li><li data-rule="match">Both passwords match</li></ul>
      <div class="atlas-field">
        <label for="confirm-password">Confirm new password</label>
        <input class="atlas-input" id="confirm-password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="confirm-password-error">
        <p class="atlas-field__error" id="confirm-password-error" hidden></p>
      </div>
      <button type="submit" class="atlas-btn atlas-btn--primary atlas-btn--lg atlas-auth__submit">Save new password</button>
    </form>
    <button type="button" class="atlas-btn atlas-btn--secondary atlas-btn--lg atlas-auth__submit" id="recovery-reload" hidden>Reload page</button>
    <p class="atlas-auth__link"><a href="index.html">Back to sign in</a></p>
  </main>
  <p class="atlas-auth__foot" data-atlas-venue-line hidden></p>
</div>
<script src="config.js"></script><script src="assets/js/rehearsal-boundary.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="assets/js/account-recovery.js"></script></body></html>
