# Atlas uses production VÁ Auth while private review, Brain, operations, scanner,
# team-message, marketing, team-profile, profile-photo, shift-planning,
# Knowledge, Reports, System, Settings and Checkpoint K intelligence data live
# in isolated Supabase branches. The branch gateway cannot validate a token
# issued by the production project, so each function authenticates the caller
# in its handler and revalidates the server-controlled active profile before
# returning or mutating private data. Brain, briefing, review, System and
# Checkpoint K require an active manager/admin profile; staff-facing endpoints
# apply their narrower server-controlled role permissions.

[functions.atlas-sprint3-review]
verify_jwt = false

[functions.atlas-sprint4-briefing]
verify_jwt = false

[functions.atlas-phase3-brain]
verify_jwt = false

[functions.atlas-phase3-intelligence]
verify_jwt = false

[functions.atlas-operations-checkpoint-a]
verify_jwt = false

[functions.atlas-inventory-scanner]
verify_jwt = false

[functions.atlas-team-messages]
verify_jwt = false

[functions.atlas-marketing-workspace]
verify_jwt = false

[functions.atlas-team-profiles]
verify_jwt = false

[functions.atlas-team-profile-photos]
verify_jwt = false

[functions.atlas-shifts]
verify_jwt = false

[functions.atlas-knowledge]
verify_jwt = false

[functions.atlas-reports]
verify_jwt = false
entrypoint = "./functions/atlas-reports/entrypoint.ts"

[functions.atlas-system]
verify_jwt = false

[functions.atlas-settings]
verify_jwt = false
