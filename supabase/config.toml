# Atlas uses production VÁ Auth while private review, Brain, operations, scanner,
# team-message and marketing data live in isolated Supabase branches. The branch
# gateway cannot validate a token issued by the production project, so these
# functions authenticate the caller inside their handlers. Brain and review
# functions require an active manager/admin profile. Staff-facing operations,
# scanner, messaging and marketing functions verify the active server-controlled
# profile and their narrower role permissions.

[functions.atlas-sprint3-review]
verify_jwt = false

[functions.atlas-sprint4-briefing]
verify_jwt = false

[functions.atlas-phase3-brain]
verify_jwt = false

[functions.atlas-operations-checkpoint-a]
verify_jwt = false

[functions.atlas-inventory-scanner]
verify_jwt = false

[functions.atlas-team-messages]
verify_jwt = false

[functions.atlas-marketing-workspace]
verify_jwt = false
