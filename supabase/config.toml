# Atlas uses production VÁ Auth while private review, Brain, operations, scanner,
# team-message, marketing, team-profile, profile-photo, shift-planning and
# Knowledge data live in isolated Supabase branches. The branch gateway cannot
# validate a token issued by the production project, so each function authenticates
# the caller in its handler and revalidates the server-controlled active profile
# before returning or mutating private data. Brain, briefing and review endpoints
# still require an active manager/admin profile; staff-facing endpoints apply
# their narrower server-controlled role permissions.

[functions.atlas-sprint3-review]
verify_jwt = false

[functions.atlas-sprint4-briefing]
verify_jwt = false

[functions.atlas-phase3-brain]
verify_jwt = false

[functions.atlas-operations-checkpoint-a]
verify_jwt = false

[functions.atlas-inventory-scanner]
verify_jwt = false

[functions.atlas-team-messages]
verify_jwt = false

[functions.atlas-marketing-workspace]
verify_jwt = false

[functions.atlas-team-profiles]
verify_jwt = false

[functions.atlas-team-profile-photos]
verify_jwt = false

[functions.atlas-shifts]
