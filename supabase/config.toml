# Atlas uses production VÁ Auth while private review, Brain and operations data
# live in isolated Supabase branches. The branch gateway cannot validate a token
# issued by the production project, so these functions authenticate the caller
# inside their handlers and require an active server-controlled Atlas profile.

[functions.atlas-sprint3-review]
verify_jwt = false

[functions.atlas-sprint4-briefing]
verify_jwt = false

[functions.atlas-phase3-brain]
verify_jwt = false

[functions.atlas-operations-checkpoint-a]
verify_jwt = false
