# Atlas uses production VÁ Auth while private review, Brain, operations, scanner,
# team-message, marketing, team-profile, profile-photo, shift-planning,
# Knowledge, Reports, System, Settings, Checkpoint K intelligence, Checkpoint L1
# stock-count evidence and Checkpoint L2 item-master drafts live in isolated
# Supabase branches. The branch gateway cannot validate a token issued by the
# production project, so each function authenticates the caller in its handler
# and revalidates the server-controlled active profile before returning or
# mutating private data. Brain, briefing, review, System, Checkpoint K, stock-count publication and Item Master L2 require an active manager/admin profile;
# staff-facing endpoints apply narrower permissions.

[functions.atlas-sprint3-review]
verify_jwt = false

[functions.atlas-sprint4-briefing]
verify_jwt = false

[functions.atlas-phase3-brain]
verify_jwt = false

[functions.atlas-phase3-intelligence]
verify_jwt = false

[functions.atlas-operations-checkpoint-a]
verify_jwt = false

[functions.atlas-inventory-scanner]
verify_jwt = false

[functions.atlas-stock-counts]
verify_jwt = false
entrypoint = "./functions/atlas-stock-counts/entrypoint.ts"

[functions.atlas-item-master]
verify_jwt = false

[functions.atlas-team-messages]
verify_jwt = false

[functions.atlas-marketing-workspace]
verify_jwt = false

[functions.atlas-team-profiles]
verify_jwt = false

[functions.atlas-team-profile-photos]
verify_jwt = false

[functions.atlas-shifts]
verify_jwt = false

[functions.atlas-knowledge]
verify_jwt = false

[functions.atlas-reports]
verify_jwt = false
entrypoint = "./functions/atlas-reports/entrypoint.ts"

[functions.atlas-system]
verify_jwt = false

[functions.atlas-settings]
verify_jwt = false

# S88: OAuth callbacks arrive from Google/Meta/TikTok without an Atlas JWT; the
# handler checks the JWT and active manager/admin profile for every other action.
[functions.atlas-integrations]
verify_jwt = false

# S88: Atlas AI. The handler verifies the production-Auth JWT and the active
# profile (_shared/auth.mjs) for every action; scheduled maintenance and
# background signals use a separate service secret header instead.
[functions.atlas-ai]
verify_jwt = false

# S89: visual inventory recognition. The handler verifies the production-Auth
# JWT and the active profile (_shared/auth.mjs) for every action; its database
# access is limited to the atlas_recognition_* RPCs (no stock writes).
[functions.atlas-inventory-recognition]
verify_jwt = false

[functions.atlas-notifications]
verify_jwt = true
