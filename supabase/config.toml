# Atlas uses production VÁ Auth while private review, Brain, operations, scanner,
# team-message, marketing, team-profile, profile-photo, shift-planning,
# Knowledge, Reports, System, Settings, Checkpoint K intelligence, Checkpoint L1
# stock-count evidence, Checkpoint L2 item-master drafts and Phase 2 connection
# evidence live in isolated Supabase branches. The branch gateway cannot validate
# a token issued by the production project, so each function authenticates the
# caller in its handler and revalidates the server-controlled active profile
# before returning or mutating private data. Brain, briefing, review, System,
# Checkpoint K, stock-count publication, Item Master L2, Connection Center,
# read-only Source Center and Checkpoint M mutations require an active
# manager/admin profile; staff-facing endpoints apply narrower permissions.

[functions.atlas-sprint3-review]
verify_jwt = false

