# Atlas uses production VÁ Auth while private review, Brain, operations, scanner,
# team-message, marketing and team-profile data live in isolated Supabase branches.
# The branch gateway cannot validate a token issued by the production project, so
# each function authenticates the caller in its handler and revalidates the
# server-controlled active profile before returning or mutating private data.

[functions.atlas-sprint3-review]
verify_jwt = false

[functions.atlas-sprint4-briefing]
verify_jwt = false

[functions.atlas-phase3-brain]
verify_jwt = false

[functions.atlas-operations-checkpoint-a]
verify_jwt = false

[functions.atlas-inventory-scanner]
verify_jwt = false

[functions.atlas-team-messages]
verify_jwt = false

[functions.atlas-marketing-workspace]
verify_jwt = false

[functions.atlas-team-profiles]
verify_jwt = false
