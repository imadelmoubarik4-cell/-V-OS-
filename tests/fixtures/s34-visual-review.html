<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas S34 local visual contract</title>
  <link rel="stylesheet" href="../../apps/web/assets/css/s34-preproduction.css">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18201d;background:#eef3f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.frame{width:min(1180px,calc(100% - 32px));min-height:720px;margin:16px auto;background:#f8fafc;border:1px solid #d7e0e8;border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(20,35,48,.12)}
    body.mobile .frame{width:390px;min-height:760px;margin:4px auto;border-radius:18px}.notice{padding:10px 24px;text-align:center;background:#fff0bd;color:#5e4b1f;font-size:14px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:680px}body.mobile .shell{grid-template-columns:1fr}.rail{padding:24px 18px;background:#f2f7fb;border-right:1px solid #dce5ed}.brand{font:700 24px Georgia,serif;margin-bottom:26px}.nav{display:grid;gap:6px}.nav span{padding:10px 12px;border-radius:10px;color:#667786}.nav .active{background:white;color:#18201d;box-shadow:0 3px 12px rgba(35,53,66,.08)}body.mobile .rail{display:none}.main{padding:28px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:#788896;font-weight:800}.search{width:min(320px,46vw);padding:10px 14px;border:1px solid #cfd9e2;border-radius:12px;background:white}.title{font-size:34px;line-height:1.1;margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #d9e2ea;border-radius:16px;padding:18px;min-height:130px;box-shadow:0 8px 24px rgba(39,58,73,.06)}.card.wide{grid-column:span 2}.metric{font-size:28px;font-weight:800;margin:8px 0}.muted{color:#738290;font-size:14px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:750;background:#2d78dc;color:white}.btn.secondary{background:white;color:#25323b;border:1px solid #cfd9e2}.btn.danger{background:#fff0f0;color:#a62d35;border:1px solid #efc7cb}.list{display:grid;gap:9px;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:#f4f8fb}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#e8f4ec;color:#2f7248;font-size:12px;font-weight:800}.composer{display:flex;gap:8px;margin-top:16px}.composer input{flex:1;padding:12px;border:1px solid #ccd8e2;border-radius:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.day{min-height:72px;padding:8px;border:1px solid #d9e2ea;border-radius:10px;background:#fff}.priority{border-left:4px solid #2d78dc}.toggle{width:42px;height:24px;border-radius:999px;background:#2d78dc;position:relative}.toggle:after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;right:3px;top:3px}body.mobile .main{padding:20px 16px}.mobile .top{align-items:flex-start}.mobile .search{width:150px}.mobile .title{font-size:28px}.mobile .grid{grid-template-columns:1fr}.mobile .card.wide{grid-column:auto}.mobile .calendar{grid-template-columns:repeat(2,1fr)}.mobile .day{min-height:58px}
  </style>
</head>
<body>
  <div class="frame">
    <div class="notice">S34 local review fixture — synthetic data only — no hosted services</div>
    <div class="shell">
      <aside class="rail"><div class="brand">VÁ · Atlas</div><div class="nav"><span class="active" id="nav-name">Home</span><span>Operations</span><span>Inventory</span><span>Recipes</span><span>Team</span><span>Insights</span><span>Settings</span></div></aside>
      <main class="main">
        <div class="top"><div><div class="eyebrow" id="eyebrow">Daily operations</div></div><input class="search" type="search" aria-label="Search" placeholder="Search Atlas…"></div>
        <h1 class="title" id="title">Home</h1>
        <section class="grid" id="content"></section>
      </main>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('module') || 'home';
    if (params.get('mode') === 'mobile') document.body.classList.add('mobile');
    const cards = {
      home: ['Home','Daily operations',`<article class="card wide priority"><div class="eyebrow">Atlas Brain · daily brief</div><h2>Inventory is ready for today’s service.</h2><p class="muted">Complete opening checks and review today’s shift coverage.</p><div class="actions"><button class="btn">Review priorities</button><button class="btn secondary">All insights</button></div></article><article class="card"><div class="eyebrow">Inventory items</div><div class="metric">24</div><span class="status">Healthy</span></article><article class="card"><div class="eyebrow">Team members</div><div class="metric">8</div><p class="muted">Open Team to load.</p></article>`],
      operations: ['Operations Center','Opening routines',`<article class="card wide"><div class="eyebrow">Today’s routine</div><h2>Opening checklist</h2><div class="list"><div class="row"><span>Check bar stations</span><span class="status">Ready</span></div><div class="row"><span>Review reservations</span><span>07:30</span></div></div><div class="actions"><button class="btn">Start routine</button></div></article><article class="card"><div class="eyebrow">Progress</div><div class="metric">0 / 9</div><p class="muted">No hidden scroll areas.</p></article>`],
      inventory: ['Inventory','Live catalog',`<article class="card wide"><div class="eyebrow">Wine · Red</div><h2>House Cabernet</h2><div class="list"><div class="row"><span>Quantity</span><strong>10 bottles</strong></div><div class="row"><span>Unit cost</span><strong>100 ISK</strong></div></div><div class="actions"><button class="btn">Save quantity</button><button class="btn secondary" aria-label="Close">Close</button></div></article><article class="card"><div class="eyebrow">After refetch</div><div class="metric">10</div><span class="status">Saved</span></article>`],
      stock: ['Stock Count','Current count',`<article class="card wide"><div class="eyebrow">Bar station</div><h2>Count inventory</h2><div class="list"><div class="row"><span>House Cabernet</span><strong>10 bottles</strong></div><div class="row"><span>Variance</span><strong>0</strong></div></div><div class="actions"><button class="btn">Save count</button><button class="btn secondary">Close</button></div></article><article class="card"><div class="eyebrow">Session</div><span class="status">Draft</span><p class="muted">Keyboard and pointer controls remain visible.</p></article>`],
      recipes: ['Recipes','Menu economics',`<article class="card wide"><div class="eyebrow">Other</div><h2>House test recipe</h2><div class="list"><div class="row"><span>Cost per serving</span><strong>200 ISK</strong></div><div class="row"><span>Menu price</span><strong>500 ISK</strong></div><div class="row"><span>Gross margin</span><strong>60%</strong></div></div><div class="actions"><button class="btn">Edit recipe</button><button class="btn secondary">Service view</button></div></article><article class="card"><div class="eyebrow">Coverage</div><div class="metric">5</div><p class="muted">servings from 10 bottles at 2 per recipe</p></article>`],
      purchasing: ['Purchasing','Orders and deliveries',`<article class="card wide"><div class="actions"><button class="btn">Orders</button><button class="btn secondary">Deliveries</button></div><div class="list"><div class="row"><span>PO-S34-001 · Test supplier</span><span class="status">Ordered</span></div><div class="row"><span>Expected delivery</span><strong>Tomorrow</strong></div></div></article><article class="card"><div class="eyebrow">Open orders</div><div class="metric">1</div><button class="btn">Receive</button></article>`],
      messages: ['Messages','Team conversations',`<article class="card"><div class="eyebrow">Channels</div><div class="list"><div class="row"><span>★ Bar team</span><strong>3</strong></div><div class="row"><span>Management</span><span>0</span></div></div></article><article class="card wide"><div class="top"><h2>Bar team</h2><button class="btn secondary" aria-pressed="true">★ Starred</button></div><div class="list"><div class="row"><span>Service notes are ready.</span><span>08:42</span></div><div class="row"><span>Thanks — reviewed.</span><span>08:45</span></div></div><div class="composer"><input aria-label="Message" placeholder="Write a message…"><button class="btn">Send</button></div></article>`],
      team: ['Team','Authorized staff',`<article class="card wide"><div class="eyebrow">Directory</div><div class="list"><div class="row"><span>Atlas administrator</span><span class="status">Active</span></div><div class="row"><span>Service viewer</span><span class="status">Active</span></div></div><div class="actions"><button class="btn">Invite staff</button></div></article><article class="card"><div class="eyebrow">Runtime modules</div><div class="metric">Loaded</div><p class="muted">Team remains in the role-authorized menu.</p></article>`],
      shifts: ['Shifts','Weekly and monthly',`<article class="card wide"><div class="actions"><button class="btn">Week</button><button class="btn secondary">Month</button></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="day"><strong>${d}</strong><p class="muted">${i<5?'16:00–23:00':'Off'}</p></div>`).join('')}</div></article><article class="card"><div class="eyebrow">Publish state</div><span class="status">Draft</span><p class="muted">No avoidable page overflow.</p></article>`],
      knowledge: ['Knowledge','Operational library',`<article class="card wide"><div class="eyebrow">Service standard</div><h2>Opening the bar</h2><p class="muted">Clear hierarchy, compact search, readable editor spacing, and blue primary actions.</p><div class="actions"><button class="btn">Edit article</button><button class="btn secondary">Close</button></div></article><article class="card"><div class="eyebrow">Articles</div><div class="metric">12</div><span class="status">Published</span></article>`],
      brain: ['Atlas Brain','Priorities and insights',`<article class="card wide priority"><div class="eyebrow">Priority</div><h2>Prepare the bar for service</h2><p class="muted">Inventory and staffing signals are grouped before secondary insights.</p><div class="actions"><button class="btn">Take action</button></div></article><article class="card"><div class="eyebrow">Recipe margin</div><div class="metric">60%</div><p class="muted">Matches Recipes and Reports.</p></article><article class="card"><div class="eyebrow">History</div><p class="muted">Past decisions remain available without crowding today’s work.</p></article>`],
      settings: ['Settings','Workspace controls',`<article class="card wide"><div class="eyebrow">Browser notifications</div><h2>Enabled on this device</h2><p class="muted">Team messages and published shifts can deep-link to the right workspace.</p><div class="actions"><button class="btn secondary">Disable</button></div></article><article class="card"><div class="top"><div><div class="eyebrow">Email summaries</div><p class="muted">Personal preference</p></div><div class="toggle" role="switch" aria-checked="true"></div></div><div class="actions"><button class="btn">Save settings</button></div></article>`]
    };
    const selected = cards[key] || cards.home;
    document.getElementById('nav-name').textContent = selected[0];
    document.getElementById('eyebrow').textContent = selected[1];
    document.getElementById('title').textContent = selected[0];
    document.getElementById('content').innerHTML = selected[2];
    document.title = `Atlas S34 — ${selected[0]} — ${params.get('mode') || 'desktop'}`;
  </script>
</body>
</html>
