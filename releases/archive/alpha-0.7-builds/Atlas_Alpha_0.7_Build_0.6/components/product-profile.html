<section id="product-profile" class="atlas-card">
  <div class="product-header">
    <img id="product-image" src="" alt="Product">
    <div>
      <h2 id="product-name">Product Name</h2>
      <p id="product-category">Category</p>
      <p id="product-supplier">Supplier</p>
    </div>
  </div>

  <div class="product-grid">
    <div><strong>Current Stock</strong><span id="current-stock">0</span></div>
    <div><strong>Par Level</strong><span id="par-level">0</span></div>
    <div><strong>Unit Cost</strong><span id="unit-cost">0 ISK</span></div>
    <div><strong>Average Cost</strong><span id="average-cost">0 ISK</span></div>
  </div>

  <h3>Recipes Using This Product</h3>
  <ul id="recipe-links"></ul>

  <h3>Recent Movements</h3>
  <table id="movement-table">
    <thead><tr><th>Date</th><th>Type</th><th>Qty</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
