[build]
  publish = "apps/web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No includeSubDomains/preload here: on *.netlify.app Netlify sends its own
    # HSTS; on a custom apex it would bind every subdomain (S96 webstore).
    Strict-Transport-Security = "max-age=63072000"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    # script-src allows only same-origin files and the exact pinned CDN files
    # (each also carries SRI). S96: no inline scripts, no inline event handlers
    # and no Blob scripts remain, so 'unsafe-inline' and blob: are gone
    # (tests/node/csp-strict-s96.test.js, tests/browser/csp-s96.browser.test.mjs).
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ewgxjzewjhitgpxcimfe.supabase.co; connect-src 'self' https://ewgxjzewjhitgpxcimfe.supabase.co wss://ewgxjzewjhitgpxcimfe.supabase.co https://api.openai.com; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'self' https://xn--vbar-5na.is; base-uri 'self'; form-action 'self'; object-src 'none'"
