name: S33 isolated Auth and Storage recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [claude/recipes-gallery-v2]
    paths:
      - '.github/workflows/s33-fullstack-recovery.yml'
      - 'scripts/*s33*'
      - 'supabase/s33/**'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - name: Run isolated full-stack recovery
        run: python3 scripts/verify_s33_fullstack.py
      - name: Retain redacted rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s33-fullstack-acceptance
          path: ${{ runner.temp }}/atlas-s33-fullstack-evidence/
          retention-days: 30
      - name: Remove disposable stacks and recovery material
        if: always()
        run: python3 scripts/verify_s33_fullstack.py --cleanup
