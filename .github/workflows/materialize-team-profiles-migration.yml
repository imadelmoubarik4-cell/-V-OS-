name: Materialize Team Profiles migration

on:
  push:
    branches:
      - agent/sprint-4-phase-3-atlas-brain

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-4-phase-3-atlas-brain
          fetch-depth: 0

      - name: Materialize migration source
        shell: bash
        run: |
          set -euo pipefail
          sql="supabase/migrations/20260803155556_atlas_team_profiles_checkpoint_e.sql"
          bundle="${sql}.gz"

          if [ -f "$sql" ]; then
            echo "Team Profiles migration is already materialized."
            exit 0
          fi

          test -f "$bundle"
          gzip -dc "$bundle" > "$sql"
          rm "$bundle"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$sql" "$bundle"
          git commit -m "chore: materialize Team Profiles migration"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain
