name: Atlas verification

on:
  pull_request:
    branches:
      - release/alpha-0.8.0
      - agent/sprint-3-real-va-data
      - agent/sprint-4-atlas-brain-daily-briefing
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  finalize-phase1-profile-login:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/sprint-4-phase-3-atlas-brain' &&
      !startsWith(github.event.head_commit.message, 'security: await active-profile verification on login')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-4-phase-3-atlas-brain
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Await profile verification and harden installer repair path
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('apps/web/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_call = "      onSignedIn(data.session);"
          new_call = "      await onSignedIn(data.session);"
          if old_call not in index and new_call not in index:
              raise RuntimeError('Could not locate signed-in activation call')
          index = index.replace(old_call, new_call, 1)
          index_path.write_text(index, encoding='utf-8')

          installer_path = Path('scripts/apply_phase1_security_gate.py')
          installer = installer_path.read_text(encoding='utf-8')
          old_guard = '''    if "PHASE1_SECURITY_GATE_UI" in content:
        return
'''
          new_guard = '''    if "PHASE1_SECURITY_GATE_UI" in content:
        content = content.replace(
            "      onSignedIn(data.session);",
            "      await onSignedIn(data.session);",
            1,
        )
        content = re.sub(
            r"\\n\\s*updated_by:\\s*currentUser(?:\\.id|\\?\\.id)?(?:\\s*\\|\\|\\s*null)?,?",
            "",
            content,
        )
        write(path, content)
        return
'''
          if old_guard in installer:
              installer = installer.replace(old_guard, new_guard, 1)
          elif new_guard not in installer:
              raise RuntimeError('Could not locate installer marker guard')
          installer_path.write_text(installer, encoding='utf-8')

          test_path = Path('tests/node/security-supply-chain.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          test_block = '''

test('active profile verification is awaited before the app opens', () => {
  assert.match(index, /await onSignedIn\\(data\\.session\\);/);
  assert.doesNotMatch(index, /(?<!await )onSignedIn\\(data\\.session\\);/);
});
'''
          if "active profile verification is awaited before the app opens" not in test_source:
              test_source += test_block
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Validate browser and installer syntax
        run: |
          python -m py_compile scripts/apply_phase1_security_gate.py
          node --check apps/web/assets/js/recipes.js

      - name: Run Node contracts
        run: npm run test:node

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run Python contracts
        run: |
          python -m compileall -q scripts tests/python
          npm run test:python

      - name: Restore standard verifier and commit the repair
        run: |
          git show "$GITHUB_SHA^:.github/workflows/atlas-verify.yml" > .github/workflows/atlas-verify.yml
          git config user.name "Atlas Security Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: await active-profile verification on login"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate browser JavaScript syntax
        run: |
          node --check apps/web/assets/js/brain-daily-briefing-v2.js
          node --check apps/web/assets/js/brain-phase3.js
          node --check apps/web/assets/js/operations-checkpoint-a.js
          node --check apps/web/assets/js/operations-checkpoint-a-layout.js
          node --check apps/web/assets/js/inventory-scanner-bootstrap.js
          node --check apps/web/assets/js/inventory-scanner.js
          node --check apps/web/assets/js/stock-count-workspace.js
          node --check apps/web/assets/js/stock-count-bootstrap.js
          node --check apps/web/assets/js/stock-count-l1-verified.js
          node --check apps/web/assets/js/team-messages.js
          node --check apps/web/assets/js/team-unread-badge.js
          node --check apps/web/assets/js/marketing-workspace.js
          node --check apps/web/assets/js/team-profiles-bootstrap.js
          node --check apps/web/assets/js/team-profile-photos.js
          node --check apps/web/assets/js/team-profile-photo-gallery.js
          node --check apps/web/assets/js/shifts-workspace.js
          node --check apps/web/assets/js/shifts-month-calendar.js
          node --check apps/web/assets/js/shifts-month-tab-bridge.js
          node --check apps/web/assets/js/knowledge-workspace.js
          node --check apps/web/assets/js/knowledge-team-link-bridge.js
          node --check apps/web/assets/js/reports-workspace.js
          node --check apps/web/assets/js/system-workspace.js
          gzip -dc apps/web/assets/js/team-profiles.bundle.js.gz > /tmp/team-profiles.js
          node --check /tmp/team-profiles.js

      - name: Run Node contract tests
        run: npm run test:node

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile Python contracts
        run: python -m compileall -q scripts tests/python

      - name: Run Python contract tests
        run: npm run test:python
