name: Atlas verification

on:
  pull_request:
    branches:
      - release/alpha-0.8.0
      - agent/sprint-3-real-va-data
      - agent/sprint-4-atlas-brain-daily-briefing
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  integrate-phase1-security-gate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/sprint-4-phase-3-atlas-brain' &&
      !startsWith(github.event.head_commit.message, 'security: integrate Phase 1 access and browser gate')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-4-phase-3-atlas-brain
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize reviewed installer contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_phase1_security_gate.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "        '''import assert from",
              "        r'''import assert from",
              1,
          )
          text = text.replace(
              "        '''from pathlib import Path",
              "        r'''from pathlib import Path",
              1,
          )
          text = text.replace(
              "  for (const hash of [SUPABASE_SRI, LUCIDE_SRI, XLSX_SRI]) assert.match(browser, new RegExp(hash));",
              "  for (const hash of [SUPABASE_SRI, LUCIDE_SRI, XLSX_SRI]) assert.ok(browser.includes(hash), `Missing reviewed SRI hash ${hash}`);",
              1,
          )
          text = text.replace(
              "  assert.doesNotMatch(index, /updated_by:\\s*currentUser/);",
              "  assert.doesNotMatch(index, /updated_by:\\s*currentUser(?:\\.id|\\?\\.id)?/);",
              1,
          )

          needle = "    write(path, content)\n\n\ndef patch_recipes() -> None:"
          replacement = (
              "    content = re.sub(\n"
              "        r\"\\n\\s*updated_by:\\s*currentUser(?:\\.id|\\?\\.id)?(?:\\s*\\|\\|\\s*null)?,?\",\n"
              "        \"\",\n"
              "        content,\n"
              "    )\n"
              "    write(path, content)\n\n\ndef patch_recipes() -> None:"
          )
          if "updated_by:\\s*currentUser(?:\\.id|\\?\\.id)?(?:\\s*\\|\\|\\s*null)?" not in text:
              if needle not in text:
                  raise RuntimeError('Could not locate patch_index write boundary')
              text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Phase 1 repository hardening
        run: python scripts/apply_phase1_security_gate.py

      - name: Validate modified browser JavaScript
        run: |
          node --check apps/web/assets/js/recipes.js
          node --check apps/web/assets/js/import-center.js
          node --check apps/web/assets/js/stock-count-workspace.js
          node --check apps/web/assets/js/settings-workspace.js
          node --check apps/web/assets/js/system-workspace.js

      - name: Run Node contracts
        run: npm run test:node

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile and run Python contracts
        run: |
          python -m compileall -q scripts tests/python
          npm run test:python

      - name: Restore standard verifier and commit passed security gate
        run: |
          git show "$GITHUB_SHA^:.github/workflows/atlas-verify.yml" > .github/workflows/atlas-verify.yml
          rm -f docs/PHASE1_SECURITY_GATE_INSTALL_ERROR.txt
          git config user.name "Atlas Security Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase 1 changes to commit."
            exit 0
          fi
          git commit -m "security: integrate Phase 1 access and browser gate"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate browser JavaScript syntax
        run: |
          node --check apps/web/assets/js/brain-daily-briefing-v2.js
          node --check apps/web/assets/js/brain-phase3.js
          node --check apps/web/assets/js/operations-checkpoint-a.js
          node --check apps/web/assets/js/operations-checkpoint-a-layout.js
          node --check apps/web/assets/js/inventory-scanner-bootstrap.js
          node --check apps/web/assets/js/inventory-scanner.js
          node --check apps/web/assets/js/stock-count-workspace.js
          node --check apps/web/assets/js/stock-count-bootstrap.js
          node --check apps/web/assets/js/stock-count-l1-verified.js
          node --check apps/web/assets/js/team-messages.js
          node --check apps/web/assets/js/team-unread-badge.js
          node --check apps/web/assets/js/marketing-workspace.js
          node --check apps/web/assets/js/team-profiles-bootstrap.js
          node --check apps/web/assets/js/team-profile-photos.js
          node --check apps/web/assets/js/team-profile-photo-gallery.js
          node --check apps/web/assets/js/shifts-workspace.js
          node --check apps/web/assets/js/shifts-month-calendar.js
          node --check apps/web/assets/js/shifts-month-tab-bridge.js
          node --check apps/web/assets/js/knowledge-workspace.js
          node --check apps/web/assets/js/knowledge-team-link-bridge.js
          node --check apps/web/assets/js/reports-workspace.js
          node --check apps/web/assets/js/system-workspace.js
          gzip -dc apps/web/assets/js/team-profiles.bundle.js.gz > /tmp/team-profiles.js
          node --check /tmp/team-profiles.js

      - name: Run Node contract tests
        run: npm run test:node

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile Python contracts
        run: python -m compileall -q scripts tests/python

      - name: Run Python contract tests
        run: npm run test:python
