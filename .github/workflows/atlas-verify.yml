name: Atlas verification

on:
  pull_request:
    branches:
      - main
      - claude/recipes-gallery-v2
      - release/alpha-0.8.0
      - agent/sprint-3-real-va-data
      - agent/sprint-4-atlas-brain-daily-briefing
      - agent/sprint-4-phase-3-atlas-brain
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Validate browser JavaScript syntax
        run: |
          for file in apps/web/assets/js/*.js apps/web/config.js apps/web/service-worker.js; do
            node --check "$file"
          done
          gzip -dc apps/web/assets/js/team-profiles.bundle.js.gz > /tmp/team-profiles.js
          node --check /tmp/team-profiles.js

      - name: Run Node contract tests
        run: npm run test:node

      - name: Set up Deno for the Atlas AI runtime suite
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run Atlas AI runtime tests (real Agents SDK, scripted model, no network)
        run: npm run test:ai

      - name: Validate the Atlas AI live evaluation cases (dry run, no key)
        run: npm run eval:ai-live:dry-run

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile Python contracts
        run: python -m compileall -q scripts tests/python

      - name: Run Python contract tests
        run: npm run test:python

  browser:
    name: Browser tests (Chromium, mocked backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pinned browser libraries and Playwright
        run: |
          npm install --no-save --package-lock=false @supabase/supabase-js@2.45.4 lucide@0.454.0 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  s34-visual-evidence:
    name: Capture S34 synthetic desktop and mobile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture network-blocked synthetic evidence
        run: node scripts/capture_s34_visual_evidence.mjs
        env:
          S34_EVIDENCE_DIR: ${{ runner.temp }}/atlas-s34-visual-evidence

      - name: Upload review gallery and screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-s34-synthetic-visual-evidence
          path: ${{ runner.temp }}/atlas-s34-visual-evidence
          if-no-files-found: error
          retention-days: 30
