name: Integrate Phase 1 security gate

on:
  push:
    branches:
      - agent/sprint-4-phase-3-atlas-brain
    paths:
      - .github/workflows/integrate-phase1-security-gate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out security-gate branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-4-phase-3-atlas-brain
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed Phase 1 repository hardening
        run: python scripts/apply_phase1_security_gate.py

      - name: Validate modified browser JavaScript
        run: |
          node --check apps/web/assets/js/recipes.js
          node --check apps/web/assets/js/import-center.js
          node --check apps/web/assets/js/stock-count-workspace.js
          node --check apps/web/assets/js/settings-workspace.js

      - name: Run Node contracts
        run: npm run test:node

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile and run Python contracts
        run: |
          python -m compileall -q scripts tests/python
          npm run test:python

      - name: Commit verified security-gate integration
        run: |
          rm -f .github/workflows/integrate-phase1-security-gate.yml
          git config user.name "Atlas Security Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "security: integrate Phase 1 access and browser gate"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain
