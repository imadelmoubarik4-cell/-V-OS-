name: Integrate Phase 1 security gate

on:
  push:
    branches:
      - agent/sprint-4-phase-3-atlas-brain
    paths:
      - .github/workflows/integrate-phase1-security-gate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out security-gate branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-4-phase-3-atlas-brain
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair generated-test string literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_phase1_security_gate.py')
          text = path.read_text()
          text = text.replace("        '''import assert from", "        r'''import assert from", 1)
          text = text.replace("        '''from pathlib import Path", "        r'''from pathlib import Path", 1)
          path.write_text(text)
          PY

      - name: Apply reviewed Phase 1 repository hardening
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/apply_phase1_security_gate.py 2>&1 | tee /tmp/phase1-installer.log

      - name: Verify patched repository
        id: verify
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check apps/web/assets/js/recipes.js
            node --check apps/web/assets/js/import-center.js
            node --check apps/web/assets/js/stock-count-workspace.js
            node --check apps/web/assets/js/settings-workspace.js
            npm run test:node
            python -m pip install --disable-pip-version-check -r requirements-test.txt
            python -m compileall -q scripts tests/python
            npm run test:python
          } 2>&1 | tee /tmp/phase1-verification.log

      - name: Publish failure diagnostic
        if: steps.apply.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          git reset --hard HEAD
          mkdir -p docs
          {
            echo "INSTALLER OUTCOME: ${{ steps.apply.outcome }}"
            cat /tmp/phase1-installer.log 2>/dev/null || true
            echo
            echo "VERIFICATION OUTCOME: ${{ steps.verify.outcome }}"
            cat /tmp/phase1-verification.log 2>/dev/null || true
          } > docs/PHASE1_SECURITY_GATE_INSTALL_ERROR.txt
          rm -f .github/workflows/integrate-phase1-security-gate.yml
          git config user.name "Atlas Security Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: capture Phase 1 integration failure"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain

      - name: Stop after failure
        if: steps.apply.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1

      - name: Commit verified security-gate integration
        if: steps.apply.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          rm -f .github/workflows/integrate-phase1-security-gate.yml
          rm -f docs/PHASE1_SECURITY_GATE_INSTALL_ERROR.txt
          git config user.name "Atlas Security Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: integrate Phase 1 access and browser gate"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain
