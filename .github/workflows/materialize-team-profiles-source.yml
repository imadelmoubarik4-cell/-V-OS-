name: Materialize Team Profiles source

on:
  push:
    branches:
      - agent/sprint-4-phase-3-atlas-brain
    paths:
      - .github/workflows/materialize-team-profiles-source.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-4-phase-3-atlas-brain
          fetch-depth: 0

      - name: Decompress maintainable source files
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc apps/web/assets/js/team-profiles.bundle.js.gz > apps/web/assets/js/team-profiles.source.js
          gzip -dc apps/web/assets/css/team-profiles.bundle.css.gz > apps/web/assets/css/team-profiles.source.css

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/assets/js/team-profiles.source.js apps/web/assets/css/team-profiles.source.css
          if git diff --cached --quiet; then
            echo "Source files are already materialized."
            exit 0
          fi
          git commit -m "chore: materialize Team Profiles source"
          git push origin HEAD:agent/sprint-4-phase-3-atlas-brain
