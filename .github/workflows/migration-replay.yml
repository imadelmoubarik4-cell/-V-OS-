name: Migration replay

on:
  pull_request:
  push:
    branches:
      - main
      - agent/sprint-4-atlas-brain-daily-briefing
      - agent/sprint-4-phase-3-atlas-brain

permissions:
  contents: read

jobs:
  replay:
    name: replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaos_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaos_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vaos_replay

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Replay historical migrations and run security acceptance
        run: bash scripts/verify_full_migration_replay.sh

      - name: Run S87 acceptance (recipe delete guard, media policies, Knowledge role matrix)
        run: bash scripts/verify_s87_previews.sh

      - name: Run S88 acceptance (venue clock, shared daily checklists, inventory activation)
        run: bash scripts/verify_s88_previews.sh
      - name: Run S88 purchasing and Data review acceptance
        run: bash scripts/verify_s88_purchasing_previews.sh
      - name: Run S88 integrations acceptance (credential isolation, single-use OAuth state)
        run: bash scripts/verify_s88_integrations_previews.sh
      - name: Run S88 Atlas AI acceptance (ownership, proposals, Brain, Knowledge search, media)
        run: bash scripts/verify_s88_ai_previews.sh
      - name: Run S89 acceptance (Visual Inventory identity, duplicate guard, recognition privileges, governance, canonical report truth)
        run: bash scripts/verify_s89_visual_inventory_previews.sh
      - name: Run S90 workflow-integrity acceptance (idempotent stock adjustments, count baselines at counted_at)
        run: bash scripts/verify_s90_workflow_integrity_previews.sh
      - name: Run S96 database/RLS acceptance (ownership, self-escalation, browser RPCs, receipt price guard, read-only ledger)
        run: bash scripts/verify_s96_previews.sh
      - name: Run S98 Training acceptance (private bucket, sealed tables/RPCs, immutable versions, version-specific completion, fail-closed)
        run: bash scripts/verify_s98_training.sh
      - name: Run Bookings acceptance (sealed tables/RPCs, atomic check-and-reserve, no double-book, requested-vs-confirmed, cancel releases, fail-closed)
        run: bash scripts/verify_s99_bookings.sh
      - name: Run S100 security & cost hardening acceptance (service-role-only AI cost/throttle RPCs, append-only block trail, sealed manager-only recipe price audit)
        run: bash scripts/verify_s100_security_cost.sh
