name: Apply Issue 6 repair patch

on:
  pull_request:
    branches:
      - agent/sprint-4-phase-3-atlas-brain
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'claude/github-issue-6-170t6j'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: claude/github-issue-6-170t6j
          fetch-depth: 0

      - name: Reassemble and verify patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue6/chunks/*.part > /tmp/issue6.patch.gz.b64
          base64 --decode /tmp/issue6.patch.gz.b64 > /tmp/issue6.patch.gz
          gzip --decompress --stdout /tmp/issue6.patch.gz > /tmp/issue6.patch
          echo "bff261ea3534d381c831b4dcab3e46f02f904304037d3695e6a580a8328b2c22  /tmp/issue6.patch" | sha256sum --check -

      - name: Reset to Sprint 4 base and apply Claude patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/sprint-4-phase-3-atlas-brain claude/github-issue-6-170t6j
          git reset --hard origin/agent/sprint-4-phase-3-atlas-brain
          git am /tmp/issue6.patch
          git push --force-with-lease origin HEAD:claude/github-issue-6-170t6j
