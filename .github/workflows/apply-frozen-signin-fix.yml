name: Apply frozen sign-in repair

on:
  push:
    branches:
      - agent/phase2-connection-center-p2-0
    paths:
      - .github/workflows/apply-frozen-signin-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-connection-center-p2-0
          fetch-depth: 0

      - name: Apply exact sign-in patch
        shell: bash
        run: |
          cat > /tmp/fix-frozen-signin-pr8.patch <<'PATCH'
          diff --git a/apps/web/index.html b/apps/web/index.html
          index 0ac8675..075cf9b 100644
          --- a/apps/web/index.html
          +++ b/apps/web/index.html
          @@ -1096,19 +1096,19 @@
               try {
                 const client = await initializeSupabase();
                 const { data, error } = await client.auth.signInWithPassword({ email, password });
          -      loginBtn.disabled = false;
          -      loginBtn.textContent = 'Sign in';
                 if (error) {
                   loginError.textContent = 'Error: ' + error.message + ' (status: ' + (error.status || 'n/a') + ')';
                   loginError.style.display = 'block';
                   return;
                 }
          -      onSignedIn(data.session);
          +      loginBtn.textContent = 'Loading your profile…';
          +      await onSignedIn(data.session);
               } catch (e) {
          +      loginError.textContent = 'Sign-in failed: ' + e.message;
          +      loginError.style.display = 'block';
          +    } finally {
                 loginBtn.disabled = false;
                 loginBtn.textContent = 'Sign in';
          -      loginError.textContent = 'Unexpected error: ' + e.message;
          -      loginError.style.display = 'block';
               }
             });
           
          @@ -1122,14 +1122,25 @@
             });
           
             async function loadActiveProfile(session) {
          -    const { data, error } = await sb
          +    const profileQuery = sb
                 .from('profiles')
                 .select('id,email,display_name,role,active')
                 .eq('id', session.user.id)
                 .maybeSingle();
           
          +    const timeout = new Promise((_, reject) =>
          +      window.setTimeout(() => reject(new Error('The profile check timed out. Check the connection and try again.')), 12000)
          +    );
          +
          +    const { data, error } = await Promise.race([profileQuery, timeout]);
          +
          +    if (error) {
          +      await sb.auth.signOut().catch(() => null);
          +      throw new Error('The staff profile could not be read (' + error.message + '). Ask an administrator to review database access.');
          +    }
          +
               const allowedRoles = new Set(['admin', 'manager', 'bartender', 'viewer']);
          -    if (error || !data?.active || !allowedRoles.has(data.role)) {
          +    if (!data?.active || !allowedRoles.has(data.role)) {
                 await sb.auth.signOut().catch(() => null);
                 throw new Error('This account is not an active VÁ staff profile. Ask an administrator to review access.');
               }
          PATCH
          git apply --check /tmp/fix-frozen-signin-pr8.patch
          git apply /tmp/fix-frozen-signin-pr8.patch

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html
          git commit -m "fix: surface frozen sign-in profile failures"
          git push origin HEAD:agent/phase2-connection-center-p2-0
